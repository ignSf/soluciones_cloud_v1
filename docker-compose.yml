services:
  # Broker 1: RabbitMQ (Inventario)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Backend Principal: Catálogo y Órdenes (Emisor a RabbitMQ y SQS)
  demo:
    build: ./demo
    container_name: demo
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: ${DEMO_DATASOURCE_URL:-jdbc:h2:mem:testdb}
      SPRING_DATASOURCE_USERNAME: ${DEMO_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DATASOURCE_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_NOTIFICACIONES_ENABLED: ${SQS_NOTIFICACIONES_ENABLED:-false}
      SQS_NOTIFICACIONES_URL: ${SQS_NOTIFICACIONES_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Microservicio 1: Inventario (Consumidor RabbitMQ + cliente Kafka)
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: ${INVENTORY_DATASOURCE_URL:-jdbc:h2:mem:inventorydb}
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DATASOURCE_PASSWORD:-}
      INVENTORY_SECURITY_OPEN: ${INVENTORY_SECURITY_OPEN:-false}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [default, cloudnet]
    restart: unless-stopped

  # Microservicio 2: Notificaciones (Consumidor Amazon SQS + SMTP Gmail)
  notificaciones-service:
    build: ./notificaciones-service
    container_name: notificaciones-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_NOTIFICACIONES_URL: ${SQS_NOTIFICACIONES_URL:-}
      SQS_NOTIFICACIONES_DLQ_URL: ${SQS_NOTIFICACIONES_DLQ_URL:-}
      SQS_CONSUMER_ENABLED: ${SQS_CONSUMER_ENABLED:-false}
      SIMULAR_FALLO: ${SIMULAR_FALLO:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    restart: unless-stopped

  # Microservicio 3: Envíos y Logística (Cliente Kafka)
  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      SPRING_DATASOURCE_URL: ${SHIPPING_DATASOURCE_URL:-jdbc:h2:mem:shippingdb}
      SPRING_DATASOURCE_USERNAME: ${SHIPPING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SHIPPING_DATASOURCE_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092
    networks: [default, cloudnet]
    restart: unless-stopped

  # Frontend Web (React + TypeScript + Vite)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/products}
        VITE_ORDERS_API_URL: ${VITE_ORDERS_API_URL:-http://localhost:8080/api/orders}
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - demo
    restart: unless-stopped

# Red compartida con la infraestructura Kafka (infra/docker-compose.kafka.yml).
# Se crea una sola vez con: docker network create cloudnet
networks:
  cloudnet:
    external: true
