spring.application.name=inventory-service

# Puerto (dinámico en Render o 8081 por defecto, para no chocar con demo en 8080)
server.port=${PORT:8081}

# Base de datos (misma convención que demo: Supabase PostgreSQL o H2 local por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventorydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad: con true se abren todos los endpoints (solo para pruebas locales con curl)
inventory.security.open=${INVENTORY_SECURITY_OPEN:false}

# RabbitMQ (en Docker Compose el host es "rabbitmq"; en local, localhost)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
