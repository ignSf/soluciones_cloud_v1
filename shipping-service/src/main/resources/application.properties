spring.application.name=shipping-service
server.port=${PORT:8083}

# Base de datos (H2 en memoria para desarrollo local / pruebas)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:shippingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# LavinMQ (AMQP 0-9-1) - En Docker Compose el host es "lavinmq" (5672); en local, localhost:5673
spring.rabbitmq.host=${LAVINMQ_HOST:localhost}
spring.rabbitmq.port=${LAVINMQ_PORT:5673}
spring.rabbitmq.username=${LAVINMQ_USER:guest}
spring.rabbitmq.password=${LAVINMQ_PASSWORD:guest}
