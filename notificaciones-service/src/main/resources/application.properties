spring.application.name=notificaciones-service
server.port=${PORT:8082}

# Amazon SQS - todos los valores vienen de variables de entorno (sin claves en el código)
app.sqs.region=${AWS_REGION:us-east-1}
app.sqs.notificaciones.queue-url=${SQS_NOTIFICACIONES_URL:}
app.sqs.notificaciones.dlq-url=${SQS_NOTIFICACIONES_DLQ_URL:}
app.sqs.notificaciones.consumer-enabled=${SQS_CONSUMER_ENABLED:true}
app.sqs.notificaciones.max-mensajes=5
app.sqs.notificaciones.wait-seconds=10
app.sqs.notificaciones.poll-delay-ms=1000

# Demostración de DLQ: con SIMULAR_FALLO=true todas las notificaciones fallan
app.notificaciones.simular-fallo=${SIMULAR_FALLO:false}