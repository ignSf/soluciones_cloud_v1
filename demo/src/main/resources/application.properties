spring.application.name=demo

# Server port
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Default profile for local development
spring.profiles.default=dev

# H2 Console disabled by default (enabled only under dev profile)
spring.h2.console.enabled=false

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS Cognito OAuth2 Resource Server
cognito.region=us-east-1
cognito.user-pool-id=us-east-1_OL9DjB9XL
cognito.client-id=53acsgrc0tneq7jhigesj93g8r
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/${cognito.user-pool-id}
cognito.jwks-url=https://cognito-idp.us-east-1.amazonaws.com/${cognito.user-pool-id}/.well-known/jwks.json

