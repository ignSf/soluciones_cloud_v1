spring.application.name=demo

# Server port (Dynamic for Render or default 8080)
server.port=${PORT:8080}

# Database Configuration (Compatible con Supabase PostgreSQL y fallback H2 local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Console (Solo activo en desarrollo local con H2)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Microsoft Entra ID Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/6cb75a5d-5ddb-4496-b0e3-f9e5d62cd9db/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=4b2106cc-d748-4c93-9ddd-48d1ba8d3a42

# Bus 1: RabbitMQ -> inventory-service (en Docker Compose el host es "rabbitmq"; en local, localhost)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Bus 2: Amazon SQS -> notificaciones-service
app.sqs.region=${AWS_REGION:us-east-1}
app.sqs.notificaciones.enabled=${SQS_NOTIFICACIONES_ENABLED:false}
app.sqs.notificaciones.queue-url=${SQS_NOTIFICACIONES_URL:}

# Bus 3: LavinMQ -> shipping-service (en Docker Compose el host es "lavinmq"; en local, localhost:5673)
app.lavinmq.host=${LAVINMQ_HOST:localhost}
app.lavinmq.port=${LAVINMQ_PORT:5673}
app.lavinmq.username=${LAVINMQ_USER:guest}
app.lavinmq.password=${LAVINMQ_PASSWORD:guest}
app.lavinmq.shipping.enabled=${LAVINMQ_SHIPPING_ENABLED:true}
